<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontconfig Configuration -->
<!-- See fonts-conf(5) for all configuration options -->
<fontconfig>
    <!-- === ICON FONT === -->
    <!-- Draw Font Awesome icons in monospace text (bar, workspaces, notifications)
         in the solid style, as the outline style comes first in the fallback
         order for icons that have both -->
    <alias>
        <family>monospace</family>
        <accept>
            <family>Font Awesome 5 Free Solid</family>
        </accept>
    </alias>
</fontconfig>
